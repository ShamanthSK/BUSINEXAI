apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stratos-ai
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        autoscaling.knative.dev/minScale: '0'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/YOUR_GCP_PROJECT_ID/stratos-ai:latest
        resources:
          limits:
            memory: 2Gi
            cpu: '2'
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
